<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function useWindowWidth() {
  const [width, setWidth] = useState(window.innerWidth);
  useEffect(() => {
    const handler = () => setWidth(window.innerWidth);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return width;
}

/* ── SVGs: se referencian los archivos originales de assets/ ── */
const SVGLogo = ({ height = 48 }) => (

);

const SVGOval = ({ size = 36 }) => (
  <img src="assets/elements/elemento1.svg" alt="" style={{ width:size, display:'block', flexShrink:0 }} />
);

const SVGBlob = ({ size = 40, color }) => (
  <img
    src={color === "#DC4A3C" ? "assets/elements/elemento3.svg" : "assets/elements/elemento2.svg"}
    alt=""
    style={{ width:size, display:'block', flexShrink:0 }}
  />
);

/* ── Datos ──
   Vienen de productos.js, que es el mismo archivo que lee el servidor al
   momento de cobrar. Para editar precios o prendas se toca SOLO ese archivo. */
const { PRODUCTS, ENVIOS, MATERIALES, CUIDADO, CATEGORIES, WHATSAPP } = PRODUCTS_DATA;

const formatPrecio = (n) => "$" + n.toLocaleString("es-CL");

/* ── Carrito ──
   Las prendas son piezas unicas: una misma prenda no se puede agregar dos veces.
   Se guarda solo la lista de ids en localStorage; los precios se resuelven
   siempre contra PRODUCTS, nunca se persisten. */
const CART_KEY = "manoyaguja:carrito";

function leerCarritoGuardado() {
  try {
    const crudo = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
    if (!Array.isArray(crudo)) return [];
    return crudo
      .map(Number)
      .filter((id) => PRODUCTS.some((p) => p.id === id && p.available));
  } catch (e) {
    return [];
  }
}

function useCarrito() {
  const [ids, setIds] = useState(leerCarritoGuardado);

  useEffect(() => {
    try { localStorage.setItem(CART_KEY, JSON.stringify(ids)); } catch (e) {}
  }, [ids]);

  const items = useMemo(
    () => ids.map((id) => PRODUCTS.find((p) => p.id === id)).filter(Boolean),
    [ids]
  );

  const subtotal = useMemo(() => items.reduce((s, p) => s + p.price, 0), [items]);

  return {
    ids,
    items,
    subtotal,
    contiene: (id) => ids.includes(id),
    agregar: (id) => setIds((prev) => (prev.includes(id) ? prev : [...prev, id])),
    quitar: (id) => setIds((prev) => prev.filter((x) => x !== id)),
    vaciar: () => setIds([]),
  };
}

/* ── Componentes ── */

        )}

      <div style={{ padding:"20px 20px 24px", display:"flex", flexDirection:"column", gap:"6px" }}>

          fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
          fontSize:"1.125rem",

        }}>{product.name}</p>
        <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"15px", fontWeight:500, color:"var(--text-secondary)", lineHeight:1.5 }}>

          <span style={{ color:"var(--text-muted)", fontWeight:400 }}> · Talla {product.talla}</span>

  );
}

/* Baja hasta una seccion de la pagina actual (el contacto esta en el pie). */

const FOTOS_TALLER = Array.from({ length: 30 }, (_, i) =>
  `assets/taller/taller-${String(i + 1).padStart(2, "0")}.webp`);

function Carrusel({ fotos, cadaMs = 2500 }) {
  const [i, setI] = useState(0);
  const [pausado, setPausado] = useState(false);
  const sinMovimiento = useMemo(
    () => window.matchMedia("(prefers-reduced-motion: reduce)").matches, []);
  const siguiente = () => setI((x) => (x + 1) % fotos.length);

  useEffect(() => {
    if (pausado || sinMovimiento) return;
    const t = setTimeout(siguiente, cadaMs);
    return () => clearTimeout(t);
  }, [i, pausado, sinMovimiento]);

  // Deja cargada la siguiente para que el cambio no parpadee.
  useEffect(() => { new Image().src = fotos[(i + 1) % fotos.length]; }, [i]);

  return (
    <div
      onMouseEnter={() => setPausado(true)} onMouseLeave={() => setPausado(false)}
      aria-roledescription="carrusel" aria-label="Fotos del taller"
    >
      <div style={{ position:"relative", aspectRatio:"3/4", background:"var(--color-crema)", overflow:"hidden", borderRadius:"16px" }}>
        <img
          key={i} src={fotos[i]} alt={`Trabajo en el taller, foto ${i + 1} de ${fotos.length}`}
          className="foto-carrusel"
          style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}
        />
      </div>
    </div>
  );
}

function CatalogView({ onSelect, cartCount, onOpenCart, estadoDe }) {
  const [activeFilter, setActiveFilter] = useState("Todas");
  const isMobile = useWindowWidth() < 640;

  const filtered = useMemo(() => {
    if (activeFilter === "Todas") return PRODUCTS;
    return PRODUCTS.filter(p => p.category === activeFilter);
  }, [activeFilter]);

  const availableCount = PRODUCTS.filter(p => estadoDe(p) === "disponible").length;

  const vendidas = filtered.filter(p => estadoDe(p) === "vendida");
  const enVenta = filtered.filter(p => estadoDe(p) !== "vendida");
  const tallas = [...new Set(enVenta.map(p => p.talla))].sort((a, b) => a - b);
  const grupos = tallas.map(t => ({ titulo: `Talla ${t}`, items: enVenta.filter(p => p.talla === t) }));
  if (vendidas.length) grupos.push({ titulo: "Vendidas", items: vendidas, vendidas: true });

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <Header cartCount={cartCount} onOpenCart={onOpenCart} />
      <main style={{ flex:1, maxWidth:"var(--max-width)", margin:"0 auto", width:"100%", padding: isMobile ? "32px 16px 60px" : "60px 32px 80px" }}>

              {availableCount} prendas<br/>disponibles
            </h1>
          </div>
          <div style={{ maxWidth:"360px" }}>
            {!isMobile && (
              <div style={{ display:"flex", alignItems:"center", gap:"14px", marginBottom:"16px" }}>
                <SVGOval size={34} />
                <SVGBlob size={38} color="#364A8A" />
                <SVGBlob size={36} color="#DC4A3C" />
              </div>
            )}
            <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"15px", lineHeight:1.7, color:"var(--text-secondary)", margin:0 }}>
              Ropa de niños que hacemos en casa. Cada prenda es irrepetible.
            </p>
          </div>
        </div>

        {/* Filtros */}
        <div style={{ display:"flex", gap: isMobile ? "16px" : "30px", flexWrap:"wrap", borderBottom:"1px solid var(--border-subtle)", marginBottom:"36px", overflowX: isMobile ? "auto" : "visible", paddingBottom: isMobile ? "0" : "0" }}>
          {CATEGORIES.map(cat => (
            <button key={cat} className={`filter-tab${activeFilter===cat?" active":""}`} onClick={() => setActiveFilter(cat)}>
              {cat}
            </button>
          ))}
        </div>

        {/* Grilla, agrupada por talla; las vendidas van al final */}
        {grupos.map(g => (
          <section key={g.titulo} style={{ marginBottom: isMobile ? "40px" : "56px" }}>
            <h2 style={{
              fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
              fontSize:"1.25rem", color: g.vendidas ? "var(--text-muted)" : "var(--text-primary)",

              gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)",

                <ProductCard key={p.id} product={p} estado={estadoDe(p)} onClick={() => onSelect(p)} />

          </section>
        ))}


        {filtered.length === 0 && (
          <p style={{ fontFamily:"'DM Sans',sans-serif", color:"var(--text-muted)", fontSize:"14px", marginTop:"48px" }}>
            No hay prendas en esta categoría por ahora.
          </p>
        )}
      </main>
      <Footer />
    </div>
  );
}

function CartView({ carrito, onBack, estadoDe, refrescarStock }) {
  const isMobile = useWindowWidth() < 640;
  const [envioId, setEnvioId] = useState(ENVIOS[0].id);
  const [cliente, setCliente] = useState({ nombre:"", email:"", telefono:"", direccion:"", comuna:"" });
  const [error, setError] = useState(null);
  const [enviando, setEnviando] = useState(false);

  // Si una prenda del carrito se vendio mientras la persona decidia, se saca
  // sola y se le avisa. Las "reservadas" se dejan: puede ser su propia
  // reserva de un intento anterior, y el servidor decide al pagar.
  useEffect(() => {
    const vendidas = carrito.items.filter((p) => estadoDe(p) === "vendida");
    if (vendidas.length === 0) return;
    vendidas.forEach((p) => carrito.quitar(p.id));
    setError(
      vendidas.length === 1
        ? `Sacamos "${vendidas[0].name}" de tu carrito: se vendió mientras mirabas. Era una pieza única.`
        : "Sacamos de tu carrito algunas prendas que se vendieron mientras mirabas."
    );
  }, [carrito.items, estadoDe]);

  const envio = ENVIOS.find((e) => e.id === envioId);
  const total = carrito.subtotal + envio.price;

  const campo = (k) => (e) => setCliente((c) => ({ ...c, [k]: e.target.value }));

  const faltaAlgo =
    !cliente.nombre.trim() ||
    !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cliente.email.trim()) ||
    (envio.pideDireccion && (!cliente.direccion.trim() || !cliente.comuna.trim()));

  async function pagar() {
    setError(null);
    setEnviando(true);
    try {
      const res = await fetch("/api/crear-preferencia", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          items: carrito.ids.map((id) => ({ id })),
          envio: envioId,
          cliente,
        }),
      });

      let datos = {};
      try { datos = await res.json(); } catch (e) {}

      if (!res.ok || !datos.init_point) {
        setError(datos.error || "No pudimos abrir el pago. Escríbenos por WhatsApp y lo resolvemos.");
        // Si el servidor dijo que una prenda ya la tomo otra persona, se saca
        // del carrito para que pueda pagar el resto sin volver a chocar.
        if (datos.prendaOcupada) carrito.quitar(datos.prendaOcupada);
        refrescarStock();
        setEnviando(false);
        return;
      }
      // Redirige al checkout de Mercado Pago.
      window.location.href = datos.init_point;
    } catch (e) {
      setError("No hay conexión con el servidor de pagos. Revisa tu internet e intenta de nuevo.");
      setEnviando(false);
    }
  }

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <Header onBack={onBack} cartCount={carrito.items.length} />
      <main style={{ flex:1, maxWidth:"820px", margin:"0 auto", width:"100%", padding: isMobile ? "0 16px 60px" : "0 32px 80px" }}>

        <div style={{ padding:"20px 0" }}>
          <button onClick={onBack} style={{
            fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
            fontSize:"15px", color:"var(--text-muted)",
            display:"flex", alignItems:"center", gap:"6px",
          }}>← Seguir viendo prendas</button>
        </div>

        <h1 style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:700, fontSize: isMobile ? "1.9rem" : "2.4rem", lineHeight:1.1, marginBottom:"28px" }}>
          Tu carrito
        </h1>

        {carrito.items.length === 0 ? (
          <div style={{ padding:"48px 0", borderTop:"1px solid var(--border-subtle)" }}>
            <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"16px", color:"var(--text-muted)", lineHeight:1.6, marginBottom:"24px" }}>
              Todavía no agregaste ninguna prenda.
            </p>
            <button className="btn btn-primario" style={{ maxWidth:"280px" }} onClick={onBack}>
              Ver el catálogo
            </button>
          </div>
        ) : (
          <React.Fragment>

            {/* Prendas */}
            <div style={{ borderTop:"1px solid var(--border-subtle)" }}>
              {carrito.items.map((p) => (
                <div key={p.id} style={{
                  display:"flex", alignItems:"center", gap:"16px",
                  padding:"16px 0", borderBottom:"1px solid var(--border-subtle)",
                }}>
                  <img src={p.images[0]} alt="" style={{
                    width:"72px", aspectRatio:"3/4", objectFit:"cover",
                    background:"var(--color-crema)", flexShrink:0,
                  }} />
                  <div style={{ flex:1, minWidth:0 }}>
                    <p style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"1.05rem" }}>{p.name}</p>
                    <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"14px", color:"var(--text-muted)", marginTop:"2px" }}>Pieza única</p>
                  </div>
                  <p style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:500, fontSize:"1rem", whiteSpace:"nowrap" }}>
                    {formatPrecio(p.price)}
                  </p>
                  <button
                    onClick={() => carrito.quitar(p.id)}
                    aria-label={`Quitar ${p.name} del carrito`}
                    style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"13px", color:"var(--color-rojo)", padding:"6px", flexShrink:0 }}
                  >Quitar</button>
                </div>
              ))}
            </div>

            {/* Entrega */}
            <h2 style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"1.25rem", margin:"36px 0 14px" }}>
              ¿Cómo lo recibes?
            </h2>
            <div style={{ display:"flex", flexDirection:"column", gap:"10px" }}>
              {ENVIOS.map((e) => (
                <button
                  key={e.id}
                  className={`envio-opcion${e.id === envioId ? " activa" : ""}`}
                  onClick={() => setEnvioId(e.id)}
                >
                  <span className="envio-radio" aria-hidden="true"></span>
                  <span style={{ flex:1 }}>
                    <span style={{ display:"flex", justifyContent:"space-between", gap:"12px", alignItems:"baseline" }}>
                      <span style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"15px" }}>{e.label}</span>
                      <span style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"14px", fontWeight:500, whiteSpace:"nowrap" }}>
                        {e.price > 0 ? formatPrecio(e.price) : e.id === "regiones" ? "Por pagar" : "Gratis"}
                      </span>
                    </span>
                    <span style={{ display:"block", fontFamily:"'DM Sans',sans-serif", fontSize:"13px", color:"var(--text-muted)", lineHeight:1.5, marginTop:"4px" }}>
                      {e.detalle}
                    </span>
                  </span>
                </button>
              ))}
            </div>

            {/* Datos */}
            <h2 style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"1.25rem", margin:"36px 0 14px" }}>
              Tus datos
            </h2>
            <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap:"16px" }}>
              <div>
                <label className="campo-label" htmlFor="nombre">Nombre y apellido</label>
                <input className="campo" id="nombre" value={cliente.nombre} onChange={campo("nombre")} autoComplete="name" />
              </div>
              <div>
                <label className="campo-label" htmlFor="email">Correo</label>
                <input className="campo" id="email" type="email" value={cliente.email} onChange={campo("email")} autoComplete="email" placeholder="para el comprobante" />
              </div>
              <div>
                <label className="campo-label" htmlFor="telefono">Teléfono <span style={{ color:"var(--text-muted)", fontWeight:400 }}>(opcional)</span></label>
                <input className="campo" id="telefono" type="tel" value={cliente.telefono} onChange={campo("telefono")} autoComplete="tel" placeholder="+56 9 ..." />
              </div>
              {envio.pideDireccion && (
                <React.Fragment>
                  <div>
                    <label className="campo-label" htmlFor="comuna">Comuna</label>
                    <input className="campo" id="comuna" value={cliente.comuna} onChange={campo("comuna")} autoComplete="address-level2" />
                  </div>
                  <div style={{ gridColumn: isMobile ? "auto" : "1 / -1" }}>
                    <label className="campo-label" htmlFor="direccion">Dirección</label>
                    <input className="campo" id="direccion" value={cliente.direccion} onChange={campo("direccion")} autoComplete="street-address" placeholder="Calle, número, depto" />
                  </div>
                </React.Fragment>
              )}
            </div>

            {/* Total */}
            <div style={{ borderTop:"1px solid var(--border-subtle)", marginTop:"36px", paddingTop:"20px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", fontFamily:"'DM Sans',sans-serif", fontSize:"15px", color:"var(--text-secondary)", marginBottom:"8px" }}>
                <span>Prendas ({carrito.items.length})</span>
                <span>{formatPrecio(carrito.subtotal)}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", fontFamily:"'DM Sans',sans-serif", fontSize:"15px", color:"var(--text-secondary)", marginBottom:"14px" }}>
                <span>{envio.label}</span>
                <span>{envio.price > 0 ? formatPrecio(envio.price) : envio.id === "regiones" ? "Por pagar" : "Gratis"}</span>
              </div>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"baseline", borderTop:"1px solid var(--border-subtle)", paddingTop:"14px" }}>
                <span style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"1.1rem" }}>Total a pagar ahora</span>
                <span style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:600, fontSize:"1.5rem" }}>{formatPrecio(total)}</span>
              </div>
              {envio.id === "regiones" && (
                <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"13px", color:"var(--text-muted)", lineHeight:1.55, marginTop:"10px" }}>
                  El envío a regiones no está incluido en este monto. Te escribimos por WhatsApp con el costo antes de despachar.
                </p>
              )}
            </div>

            {error && (
              <p className="aviso-error" style={{ marginTop:"20px" }}>{error}</p>
            )}

            <div style={{ marginTop:"24px" }}>
              <button className="btn btn-primario" onClick={pagar} disabled={faltaAlgo || enviando}>
                {enviando ? "Abriendo Mercado Pago…" : "Pagar con Mercado Pago"}
              </button>
              <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"13px", color:"var(--text-muted)", lineHeight:1.55, marginTop:"12px", textAlign:"center" }}>
                Te llevamos al sitio de Mercado Pago para pagar. Puedes usar tarjeta de crédito, débito o tu saldo. Nosotros no guardamos los datos de tu tarjeta.
              </p>
            </div>

          </React.Fragment>
        )}
      </main>
      <Footer />
    </div>
  );
}

/* ── Stock en vivo ──
   El servidor sabe que prendas ya se vendieron o estan siendo pagadas ahora.
   Esto es solo para mostrarlo: quien decide de verdad si se puede comprar es
   el servidor al reservar, y eso no se puede saltar desde el navegador. */
function useStock() {
  const [stock, setStock] = useState({ vendidas: [], reservadas: [] });

  const refrescar = React.useCallback(() => {
    fetch("/api/estado-stock")
      .then((r) => (r.ok ? r.json() : null))
      .then((d) => {
        if (!d) return;
        setStock({ vendidas: d.vendidas || [], reservadas: d.reservadas || [] });
      })
      .catch(() => {
        // Sin conexion se muestra el catalogo completo. No es riesgoso: si la
        // prenda ya no esta, el pago se rechaza al intentar reservarla.
      });
  }, []);

  useEffect(() => { refrescar(); }, [refrescar]);

  // Al volver a la pestaña (por ejemplo despues de pagar) se vuelve a mirar.
  useEffect(() => {
    const alVolver = () => { if (!document.hidden) refrescar(); };
    document.addEventListener("visibilitychange", alVolver);
    return () => document.removeEventListener("visibilitychange", alVolver);
  }, [refrescar]);

  const estadoDe = React.useCallback((producto) => {
    if (!producto.available) return "vendida";
    if (stock.vendidas.includes(producto.id)) return "vendida";
    if (stock.reservadas.includes(producto.id)) return "reservada";
    return "disponible";
  }, [stock]);

  return { estadoDe, refrescar };
}

function App() {
  const carrito = useCarrito();
  const { estadoDe, refrescar } = useStock();
  const [selected, setSelected] = useState(null);
  const [enCarrito, setEnCarrito] = useState(false);

  // "El taller" tiene su propia direccion (tallermanoyaguja.com/#taller), asi se
  // puede compartir el link y el boton Atras del navegador funciona.
  const [enTaller, setEnTaller] = useState(location.hash === "#taller");
  useEffect(() => {
    const alCambiar = () => {
      const t = location.hash === "#taller";
      setEnTaller(t);
      if (t) { setSelected(null); setEnCarrito(false); }
    };
    window.addEventListener("hashchange", alCambiar);
    return () => window.removeEventListener("hashchange", alCambiar);
  }, []);
  const volverAlCatalogo = () => {
    history.pushState(null, "", location.pathname + location.search);
    setEnTaller(false);
  };

  // Al cambiar de vista se vuelve arriba, si no la pagina queda a media altura.
  useEffect(() => { window.scrollTo(0, 0); }, [selected, enCarrito, enTaller]);

  const abrirCarrito = () => { setEnCarrito(true); setSelected(null); refrescar(); };

  if (enCarrito) {
    return (
      <CartView
        carrito={carrito}
        onBack={() => setEnCarrito(false)}
        estadoDe={estadoDe}
        refrescarStock={refrescar}
      />
    );
  }
  if (selected) {
    return (
      <DetailView
        product={selected}
        onBack={() => setSelected(null)}
        carrito={carrito}
        onOpenCart={abrirCarrito}
        estadoDe={estadoDe}
      />
    );
  }
  if (enTaller) {
    return (
      <TallerView
        onBack={volverAlCatalogo}
        cartCount={carrito.items.length}
        onOpenCart={abrirCarrito}
      />
    );
  }
  return (
    <CatalogView
      onSelect={setSelected}
      cartCount={carrito.items.length}
      onOpenCart={abrirCarrito}
      estadoDe={estadoDe}
    />
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
