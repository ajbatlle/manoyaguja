<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mano y Aguja — Catálogo</title>
<link rel="icon" type="image/svg+xml" href="assets/elements/elemento1.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --color-amarillo:       #D4B232;
  --color-amarillo-fondo: #F9F4DB;
  --color-azul:           #364A8A;
  --color-azul-fondo:     #E7EAF6;
  --color-rojo:           #DC4A3C;
  --color-rojo-fondo:     #FBE9E7;
  --color-crema:          #EEECE7;
  --color-crema-oscura:   #E0DDD6;
  --color-blanco:         #FFFFFF;
  --color-negro:          #111111;
  --color-gris-oscuro:    #3D3D3A;
  --color-gris-medio:     #76756E;
  --color-gris-claro:     #C8C5BD;
  --color-gris-muy-claro: #E5E3DE;
  --bg-base:       var(--color-blanco);
  --bg-surface:    var(--color-blanco);
  --text-primary:   var(--color-negro);
  --text-secondary: var(--color-gris-oscuro);
  --text-muted:     var(--color-gris-medio);
  --border-subtle:  var(--color-gris-muy-claro);
  --border-default: var(--color-gris-claro);
  --shadow-md: 0 4px 12px rgba(17,17,17,0.10), 0 2px 4px rgba(17,17,17,0.06);
  --max-width: 1152px;
  --transition: 200ms cubic-bezier(0.4, 0, 0.2, 1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg-base);
  color: var(--text-primary);
  font-family: 'DM Sans', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
img, svg { display: block; max-width: 100%; }
button { font: inherit; cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; text-decoration: none; }

.nav-link {
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-muted);
  transition: color var(--transition);
}
.nav-link:hover, .nav-link.active { color: var(--text-primary); }

.filter-tab {
  font-family: 'Josefin Sans', sans-serif;
  font-weight: 600;
  font-size: 15px;
  color: var(--text-muted);
  padding-bottom: 13px;
  border-bottom: 2px solid transparent;
  transition: color var(--transition), border-color var(--transition);
  white-space: nowrap;
}
.filter-tab:hover { color: var(--text-primary); }
.filter-tab.active { color: var(--text-primary); border-bottom-color: var(--color-negro); }

.product-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  cursor: pointer;
  overflow: hidden;
  transition: box-shadow var(--transition), transform var(--transition);
}
.product-card:hover {
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

function useWindowWidth() {
  const [width, setWidth] = useState(window.innerWidth);
  useEffect(() => {
    const handler = () => setWidth(window.innerWidth);
    window.addEventListener("resize", handler);
    return () => window.removeEventListener("resize", handler);
  }, []);
  return width;
}

/* ── SVGs: se referencian los archivos originales de assets/ ── */
const SVGLogo = ({ height = 48 }) => (
  <img src="assets/logos/logo-color-ma.svg" alt="Mano y Aguja" style={{ height, display:'block' }} />
);

const SVGOval = ({ size = 36 }) => (
  <img src="assets/elements/elemento1.svg" alt="" style={{ width:size, display:'block', flexShrink:0 }} />
);

const SVGBlob = ({ size = 40, color }) => (
  <img
    src={color === "#DC4A3C" ? "assets/elements/elemento3.svg" : "assets/elements/elemento2.svg"}
    alt=""
    style={{ width:size, display:'block', flexShrink:0 }}
  />
);

/* ── Datos ── */
const PRECIO_CHAQUETA = 60000;
const PRECIO_PANTALON = 20000;

const formatPrecio = (n) => "$" + n.toLocaleString("es-CL");

const PRODUCTS = [
  { id:1,  name:"Chaqueta 01", price:PRECIO_CHAQUETA, category:"Chaquetas",  available:true, images:["assets/chaqueta-azul-roja1.png","assets/chaqueta-azul-roja.png"] },
  { id:2,  name:"Chaqueta 02", price:PRECIO_CHAQUETA, category:"Chaquetas",  available:true, images:["assets/chaqueta-cuadros.png","assets/chaqueta-cuadros1.png"] },
  { id:3,  name:"Chaqueta 03", price:PRECIO_CHAQUETA, category:"Chaquetas",  available:true, images:["assets/chaqueta-verde.png","assets/chaqueta-verde1.png"] },

  { id:4,  name:"Pantalón 01", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon.png"] },
  { id:5,  name:"Pantalón 02", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon1.png"] },
  { id:6,  name:"Pantalón 03", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon2.png"] },
  { id:7,  name:"Pantalón 04", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon3.png"] },
  { id:8,  name:"Pantalón 05", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon4.png"] },
  { id:9,  name:"Pantalón 06", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon5.png"] },
  { id:10, name:"Pantalón 07", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon6.png"] },
  { id:11, name:"Pantalón 08", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon7.png"] },
  { id:12, name:"Pantalón 09", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon8.png"] },
  { id:13, name:"Pantalón 10", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon9.png"] },
  { id:14, name:"Pantalón 11", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon10.png"] },
  { id:15, name:"Pantalón 12", price:PRECIO_PANTALON, category:"Pantalones", available:true, images:["assets/pantalon11.png"] },
];

const MATERIALES = "Algodón y telas recicladas.";
const CUIDADO = "Lavar a mano o máquina en frío. No usar secadora. Planchar a temperatura media.";

const CATEGORIES = ["Todas","Chaquetas","Pantalones"];

/* ── Componentes ── */
function ProductCard({ product, onClick }) {
  return (
    <article className="product-card" onClick={onClick}>
      <div style={{ position:"relative", aspectRatio:"3/4", background:"var(--color-crema)", overflow:"hidden" }}>
        <img
          src={product.images[0]}
          alt={product.name}
          style={{
            width:"100%", height:"100%",
            objectFit:"cover", objectPosition:"center", display:"block",
            opacity: product.available ? 1 : 0.5,
            filter: product.available ? "none" : "grayscale(40%)",
          }}
        />
        {!product.available && (
          <div style={{
            position:"absolute", bottom:0, left:0, right:0,
            background:"var(--color-gris-muy-claro)",
            padding:"6px 12px",
            fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
            fontSize:"13px",
            color:"var(--text-muted)", textAlign:"center",
          }}>Reservada</div>
        )}
      </div>
      <div style={{ padding:"20px 20px 24px", display:"flex", flexDirection:"column", gap:"6px" }}>
        <p style={{
          fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
          fontSize:"1.125rem",
          color:"var(--text-primary)", lineHeight:1.2,
        }}>{product.name}</p>
        <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"15px", fontWeight:500, color:"var(--text-secondary)", lineHeight:1.5 }}>
          {formatPrecio(product.price)}
        </p>
      </div>
    </article>
  );
}

function Header({ onBack }) {
  const isMobile = useWindowWidth() < 640;
  return (
    <header style={{
      position:"sticky", top:0, zIndex:20,
      background:"#fff", borderBottom:"1px solid var(--border-subtle)",
    }}>
      <div style={{
        maxWidth:"var(--max-width)", margin:"0 auto",
        height: isMobile ? "76px" : "116px",
        padding: isMobile ? "0 16px" : "0 32px",
        display:"flex", alignItems:"center", justifyContent:"space-between",
      }}>
        <div style={{cursor:"pointer"}} onClick={onBack || undefined}>
          <SVGLogo height={isMobile ? 56 : 92} />
        </div>
        {!isMobile && (
          <nav style={{ display:"flex", alignItems:"center", gap:"30px" }}>
            <button className={`nav-link${!onBack?" active":""}`} onClick={onBack}>Catálogo</button>
            <button className="nav-link">El taller</button>
            <button className="nav-link">Contacto</button>
          </nav>
        )}
      </div>
    </header>
  );
}

function Footer() {
  const isMobile = useWindowWidth() < 640;
  return (
    <footer style={{
      background:"#E8E5DF",
      borderTop:"1px solid var(--border-subtle)",
      padding: isMobile ? "32px 16px" : "48px 32px",
    }}>
      <div style={{
        maxWidth:"var(--max-width)", margin:"0 auto",
        display:"flex",
        flexDirection: isMobile ? "column" : "row",
        justifyContent:"space-between", alignItems: isMobile ? "flex-start" : "flex-start",
        gap:"32px",
      }}>
        <div style={{ maxWidth:"320px" }}>
          <img
            src="assets/logos/logo-texto-ma.svg"
            alt="Mano y Aguja"
            style={{ height:"22px", display:"block", marginBottom:"14px" }}
          />
          <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"14px", color:"var(--text-secondary)", lineHeight:1.6 }}>
            Taller textil de producción local y pequeña escala. Cada prenda es única.
          </p>
        </div>
        <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:"16px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
            <SVGOval size={28} />
            <SVGBlob size={32} color="#364A8A" />
            <SVGBlob size={30} color="#DC4A3C" />
          </div>
          <div style={{ display:"flex", gap:"20px" }}>
            <a href="https://www.instagram.com/manoyaguja/" target="_blank" rel="noopener noreferrer" style={{
              fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
              fontSize:"15px", color:"var(--text-muted)",
            }}>Instagram</a>
            <span style={{ color:"var(--border-default)" }}>·</span>
            <a href="https://wa.me/56987362295" target="_blank" rel="noopener noreferrer" style={{
              fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
              fontSize:"15px", color:"var(--text-muted)",
            }}>WhatsApp</a>
          </div>
        </div>
      </div>
    </footer>
  );
}

function CatalogView({ onSelect }) {
  const [activeFilter, setActiveFilter] = useState("Todas");
  const isMobile = useWindowWidth() < 640;

  const filtered = useMemo(() => {
    if (activeFilter === "Todas") return PRODUCTS;
    return PRODUCTS.filter(p => p.category === activeFilter);
  }, [activeFilter]);

  const availableCount = PRODUCTS.filter(p => p.available).length;

  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <Header />
      <main style={{ flex:1, maxWidth:"var(--max-width)", margin:"0 auto", width:"100%", padding: isMobile ? "32px 16px 60px" : "60px 32px 80px" }}>

        {/* Hero */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", flexDirection: isMobile ? "column" : "row", alignItems: isMobile ? "flex-start" : "flex-end", gap: isMobile ? "20px" : "32px", marginBottom: isMobile ? "32px" : "48px" }}>
          <div>
            <p style={{ display:"flex", alignItems:"center", gap:"12px", fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"16px", color:"var(--text-muted)", margin:0 }}>
              <SVGOval size={16} />
              Lo que hay ahora
            </p>
            <h1 style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:700, fontSize: isMobile ? "clamp(1.8rem,8vw,2.4rem)" : "clamp(2.2rem,5vw,3.2rem)", lineHeight:1.05, margin:"18px 0 0" }}>
              {availableCount} prendas<br/>disponibles
            </h1>
          </div>
          {!isMobile && (
            <div style={{ maxWidth:"360px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:"14px", marginBottom:"16px" }}>
                <SVGOval size={34} />
                <SVGBlob size={38} color="#364A8A" />
                <SVGBlob size={36} color="#DC4A3C" />
              </div>
              <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"15px", lineHeight:1.7, color:"var(--text-secondary)", margin:0 }}>
                Producción basada en stock disponible. Cada prenda es única.
              </p>
            </div>
          )}
        </div>

        {/* Filtros */}
        <div style={{ display:"flex", gap: isMobile ? "16px" : "30px", flexWrap:"wrap", borderBottom:"1px solid var(--border-subtle)", marginBottom:"36px", overflowX: isMobile ? "auto" : "visible", paddingBottom: isMobile ? "0" : "0" }}>
          {CATEGORIES.map(cat => (
            <button key={cat} className={`filter-tab${activeFilter===cat?" active":""}`} onClick={() => setActiveFilter(cat)}>
              {cat}
            </button>
          ))}
        </div>

        {/* Grilla */}
        <div style={{
          display:"grid",
          gridTemplateColumns: isMobile ? "1fr" : "repeat(2, 1fr)",
          gap: isMobile ? "16px" : "24px",
        }}>
          {filtered.map(p => <ProductCard key={p.id} product={p} onClick={() => onSelect(p)} />)}
        </div>

        {filtered.length === 0 && (
          <p style={{ fontFamily:"'DM Sans',sans-serif", color:"var(--text-muted)", fontSize:"14px", marginTop:"48px" }}>
            No hay prendas en esta categoría por ahora.
          </p>
        )}
      </main>
      <Footer />
    </div>
  );
}

function DetailView({ product, onBack }) {
  const isMobile = useWindowWidth() < 640;
  const [activeImage, setActiveImage] = useState(0);
  useEffect(() => { setActiveImage(0); }, [product.id]);
  const hasGallery = product.images.length > 1;
  return (
    <div style={{ minHeight:"100vh", display:"flex", flexDirection:"column" }}>
      <Header onBack={onBack} />
      <main style={{ flex:1, maxWidth:"860px", margin:"0 auto", width:"100%", padding: isMobile ? "0 16px 60px" : "0 32px 80px" }}>
        <div style={{ padding:"20px 0" }}>
          <button onClick={onBack} style={{
            fontFamily:"'Josefin Sans',sans-serif", fontWeight:600,
            fontSize:"15px", color:"var(--text-muted)",
            display:"flex", alignItems:"center", gap:"6px",
            cursor:"pointer", background:"none", border:"none",
          }}>← Volver al catálogo</button>
        </div>

        <div style={{ display:"grid", gridTemplateColumns: isMobile ? "1fr" : "1fr 1fr", gap: isMobile ? "24px" : "48px", marginTop:"16px", alignItems:"start" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
            <div style={{ position:"relative", aspectRatio:"3/4", background:"var(--color-crema)", overflow:"hidden" }}>
              <img
                src={product.images[activeImage]}
                alt={product.name}
                style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }}
              />
            </div>
            {hasGallery && (
              <div style={{ display:"flex", gap:"10px" }}>
                {product.images.map((src, i) => (
                  <button
                    key={i}
                    onClick={() => setActiveImage(i)}
                    aria-label={`Ver foto ${i + 1} de ${product.name}`}
                    style={{
                      width:"76px", aspectRatio:"3/4",
                      background:"var(--color-crema)", overflow:"hidden",
                      border: i === activeImage ? "2px solid var(--color-azul)" : "2px solid var(--border-subtle)",
                      padding:0, cursor:"pointer",
                      opacity: i === activeImage ? 1 : 0.65,
                      transition:"opacity var(--transition), border-color var(--transition)",
                    }}
                  >
                    <img src={src} alt="" style={{ width:"100%", height:"100%", objectFit:"cover", display:"block" }} />
                  </button>
                ))}
              </div>
            )}
          </div>

          <div style={{ paddingTop: isMobile ? "0" : "8px" }}>
            <h1 style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"2rem", lineHeight:1.15, color:"var(--text-primary)" }}>
              {product.name}
            </h1>
            <p style={{ fontFamily:"'DM Sans',sans-serif", fontWeight:500, fontSize:"1.375rem", color:"var(--text-primary)", marginTop:"10px" }}>
              {formatPrecio(product.price)}
            </p>
            <div style={{ borderTop:"1px solid var(--border-subtle)", marginTop:"28px", paddingTop:"24px" }}>
              <p style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"15px", color:"var(--text-primary)", marginBottom:"6px" }}>Materiales</p>
              <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"14px", color:"var(--text-muted)", lineHeight:1.6 }}>{MATERIALES}</p>
            </div>
            <div style={{ borderTop:"1px solid var(--border-subtle)", marginTop:"24px", paddingTop:"24px" }}>
              <p style={{ fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"15px", color:"var(--text-primary)", marginBottom:"6px" }}>Cuidado</p>
              <p style={{ fontFamily:"'DM Sans',sans-serif", fontSize:"14px", color:"var(--text-muted)", lineHeight:1.6 }}>{CUIDADO}</p>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:"10px", marginTop:"32px" }}>
              <a href={`https://wa.me/56987362295?text=${encodeURIComponent("Hola, quiero consultar por: " + product.name + " (" + formatPrecio(product.price) + ")")}`} target="_blank" rel="noopener noreferrer" style={{
                display:"flex", alignItems:"center", justifyContent:"center",
                background:"var(--color-azul)", color:"#fff",
                padding:"16px 24px",
                fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"16px",
              }}>Consultar por WhatsApp</a>
              <a href="https://www.instagram.com/manoyaguja/" target="_blank" rel="noopener noreferrer" style={{
                display:"flex", alignItems:"center", justifyContent:"center",
                border:"2px solid var(--color-azul)", color:"var(--color-azul)",
                padding:"14px 24px",
                fontFamily:"'Josefin Sans',sans-serif", fontWeight:600, fontSize:"16px",
              }}>Ver en Instagram</a>
            </div>
          </div>
        </div>
      </main>
      <Footer />
    </div>
  );
}

function App() {
  const [selected, setSelected] = useState(null);
  return selected
    ? <DetailView product={selected} onBack={() => setSelected(null)} />
    : <CatalogView onSelect={setSelected} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
